serverguard:
  # 运行模式：plugin（Paper 插件嵌入式）或 external（传统外部监控）
  # Paper 插件模式由系统属性 serverguard.mode=plugin 自动设置
  mode: ${SERVERGUARD_MODE:external}

  minecraft:
    service-name: minecraft
    process-name: paper-1.21.11.jar
    jar-file: paper-1.21.11.jar
    working-dir: /opt/minecraft
    java-opts: -Xms4G -Xmx4G
    check-interval-seconds: 5
    rcon:
      enabled: true
      host: localhost
      port: 25575
      password: ${RCON_PASSWORD:}

  monitor:
    tps-threshold: 15
    cpu-threshold: 80.0
    memory-threshold: 85.0
    connection-threshold: 50
    log-watch-lines: 100
    log-path: /opt/minecraft/logs/latest.log

  alert:
    enabled: true
    email:
      smtp-host: smtp.qq.com
      smtp-port: 587
      username: ${ALUER_ALERT_SMTP_USERNAME:}
      password: ${ALUER_ALERT_SMTP_PASSWORD:}
      to:
        - ${ALUER_ALERT_EMAIL_PRIMARY:}
        - ${ALUER_ALERT_EMAIL_SECONDARY:}
      rate-limit:
        per-type-seconds: 300
        max-emails-per-minute: 10

  ai:
    enabled: true
    use-isolation-forest: true
    use-prediction: true
    sliding-window-size: 100
    anomaly-threshold: 0.7
    prediction-horizon-minutes: 60
    deepseek:
      enabled: true
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      max-tokens: 1000
      temperature: 0.35
      auto-analyze-alerts: true
      analysis-interval-seconds: 45
      auto-execute:
        enabled: true
        ban-ip: true
        kill-entity: true
        clear-lag: true
        set-spawn-rate: true
        kick-player: true
        whitelist: true
        min-confidence: 88

  security:
    enabled: true
    auto-ban-vpn: true
    check-on-login: true
    max-connections-per-ip: 3
    block-common-exploits: true
    log-all-commands: true
    anti-intrusion:
      enabled: true
      monitor-commands: true
      monitor-processes: true
      monitor-files: true
      monitor-plugins: true
      monitor-systemd: true
      monitor-rcon: true
      file-integrity:
        enabled: true
        max-depth: 5
    host-enforcement:
      enabled: true
      dry-run: true
      preferred-backend: auto
      default-block-minutes: 60
      default-rate-limit-per-minute: 120
      mirror-to-cloud-edge: true
    cloud-edge:
      enabled: false
      dry-run: true
      provider: cloudflare
      zone-id: ${ALUER_CLOUDFLARE_ZONE_ID:}
      api-key: ${ALUER_CLOUDFLARE_API_KEY:}
      api-email: ${ALUER_CLOUDFLARE_EMAIL:}
      default-block-mode: block
      default-challenge-mode: challenge
      enable-under-attack-on-critical: true
    orchestration:
      enabled: true
      allow-local-block: true
      allow-edge-challenge: true
      allow-minecraft-defense: true
      notify-on-critical: true
    autonomy:
      enabled: true
      deepseek-dominant: true
      quiet-console: true
      loop-interval-seconds: 45
      min-risk-score-for-action: 70
      critical-risk-score: 90
      workflow-cooldown-seconds: 180
      max-actions-per-hour: 12
      require-second-signal-for-containment: true
    shield:
      enabled: true
      auto-mode: true
      auto-enable-under-attack: true
      heat-trigger: 78
      resonance-trigger: 72
      threat-score-trigger: 85
      edge-challenge-offender-limit: 6
      shelter-rate-limit-per-minute: 45
      attacker-notice-enabled: true
      deterrence-message: Your source has been identified, recorded, and isolated by Aluer.
    kernel:
      enabled: true
      pulse-interval-seconds: 30
      pulse-history-size: 180
      journal-size: 300
      echo-retention-minutes: 180
      adaptive-weights: true
      directive-heat-threshold: 60
      lockdown-heat-threshold: 82
    task-bus:
      enabled: true
      auto-dispatch: true
      dispatch-interval-seconds: 10
      queue-limit: 200
      history-limit: 300
    self-healing:
      enabled: true
      dry-run: true
      loop-interval-seconds: 45
      auto-backup-before-recovery: true
      auto-whitelist-on-swarm: true
      allow-soft-restart: true
      tps-emergency-threshold: 12
      cpu-emergency-threshold: 92.0
      memory-emergency-threshold: 95.0
      max-recovery-actions-per-hour: 8

      super-evolution:
        # === V4.0 高级扩展安全模块开关 ===
        jwt-auth: true                    # JWT身份认证与令牌管理
        brute-force: true                 # 暴力破解防护（多时间窗口检测）
        anti-bot: true                    # 反机器人检测（Bot名称/加入速率/IP关联）
        reverse-shell: true               # 反向Shell检测（50+ shell模式匹配）
        arp-spoof: true                   # ARP欺骗检测（MAC变更/网关伪造）
        dns-tunnel: true                  # DNS隧道检测（熵值/Base32编码/可疑TLD）
        exploit-signature: true           # 漏洞签名检测（Log4Shell/SQLi/RCE等15种）
        ssrf: true                        # SSRF防护（内网IP/云元数据/协议限制）
        xxe: true                         # XXE防护（实体注入/Billion Laughs检测）
        csp: true                         # CSP安全头强制执行（8种响应头）
        database-firewall: true           # 数据库防火墙（SQL注入/联合查询/时间盲注）
        dlp: true                         # 数据防泄漏（12种敏感信息规则+自动脱敏）
        memory-protection: true           # JVM内存保护（堆/GC/内存泄漏检测）
        process-injection: true           # 进程注入检测（/proc扫描/线程异常）
        secure-delete: true               # 安全文件删除（多道覆写DoD标准）
        forensics: true                   # 取证收集（进程/网络/日志快照）
        incident-response: true           # 事件响应（5种预定义响应剧本）
        threat-hunting: true              # 威胁狩猎（10种狩猎定义/5个类别）
        compliance: true                  # 合规扫描（7类20+检查项）
        anti-grief: true                  # 反破坏检测（方块破坏率/TNT/纵火/偷箱）
        # === Minecraft 专属防护模块开关 ===
        anti-xray: true                   # X-ray透视检测（钻石比/直线挖掘/暗处精准）
        anti-fly: true                    # 飞行外挂检测（垂直/水平速度/悬空时间）
        anti-dupe: true                   # 物品复制检测（堆叠异常/高价值暴涨/9种复制法）
        crash-exploit: true               # 崩溃漏洞防护（超大包/NBT炸弹/书与笔攻击）
        lag-machine: true                 # 卡服机检测（Observer链/TNT堆/红石密度）
        # === V4.0 新增模块开关 ===
        geo-block: true                   # 地理IP封锁（按国家/地区拦截）
        session-validation: true          # 玩家会话验证（UUID伪造/正版/离线检测）
        plugin-verification: true         # 插件完整性校验（Hash对比/未授权修改）
        connection-throttle: true         # 连接速率限制（IP/时间窗口/递增延迟）
        backup-integrity: true            # 备份完整性校验（SHA-256/文件计数/大小对比）
        anti-skin-spoof: true             # 皮肤伪造检测（模型数据异常/皮肤URL检测）
        # === V4.0 反作弊扩展模块 ===
        anti-kill-aura: true              # 杀戮光环检测（攻击频率/目标切换/旋转角度）
        anti-reach: true                  # 超距攻击检测（攻击距离/位置回溯验证）
        anti-speed: true                  # 水平速度检测（移动速度/GroundSpoof异常）
        anti-jesus: true                  # 水上行走检测（水面/岩浆面移动验证）
        anti-no-fall: true                # 无摔落伤害检测（落地检测/伤害验证）
        anti-scaffold: true               # 自动搭路检测（方块放置频率/角度/速度）
        anti-timer: true                  # 游戏加速检测（Timer hack/移动tick间隔异常）
        anti-velocity: true               # 击退修改检测（抗击退/击退幅度异常）
        anti-phase: true                  # 穿墙检测（Phase hack/方块剪切/固体穿越）
        anti-blink: true                  # 闪烁检测（Blink hack/快速断连躲避伤害）
        anti-fast-break: true             # 快速破坏检测（加速挖掘/方块破坏速度异常）
        anti-elytra-fly: true             # 鞘翅飞行检测（ElytraFly/鞘翅速度/高度操控）
        # === V5.1 反作弊战斗模块（Meteor Client 对抗） ===
        anti-criticals: true              # 自动暴击检测（零速度暴击/暴击率异常/无跳跃暴击）
        anti-auto-totem: true             # 自动不死图腾检测（图腾换装速度/连续图腾使用）
        anti-surround: true               # 自动包围检测（四向方块放置速度/防御方块模式）
        anti-auto-trap: true              # 自动困笼检测（目标玩家围笼/活塞陷阱构建速度）
        anti-auto-crystal: true           # 自动末影水晶检测（水晶放置/引爆速度/最优位置计算）
        anti-auto-armor: true             # 自动盔甲检测（多槽位装甲切换速度/背包扫描模式）
        anti-chest-swap: true             # 快速胸甲切换检测（胸甲/鞘翅互换tick检测）
        anti-auto-log: true               # 自动断线检测（受伤后立即断开/低血量脱战模式）
        anti-hitboxes: true               # 扩大碰撞箱检测（边缘命中率/射线追踪距离分析）
        anti-bow-aimbot: true             # 弓自瞄检测（移动目标命中率/弹道一致性/瞬发精准）
        # === V5.2 反作弊移动模块（Meteor Client 移动类对抗） ===
        anti-no-slow: true                # 无减速检测（使用物品时移速不减/吃食物/拉弓/举盾速度检测）
        anti-spider: true                 # 爬墙检测（无攀爬方块贴墙上升/固体方块攀爬/垂直墙面移动）
        anti-step: true                   # 自动跨步检测（无跳跃跨越完整方块/上升1方块无跳跃冲量）
        anti-packet-fly: true             # 数据包飞行检测（数据包操控飞行/上下震荡模式/永不落地）
        anti-air-jump: true               # 空中跳跃检测（半空发送跳跃数据包/连续空中跳跃）
        anti-long-jump: true              # 远跳检测（极端水平跳跃距离/跳跃后水平速度持续不减）
        anti-anti-hunger: true            # 反饥饿检测（饥饿值消耗绕过/高活动量零饥饿消耗）
        anti-fast-fall: true              # 快速坠落检测（超终端速度下落/持续超速坠落/瞬间坠落）
        anti-vclip: true                  # 垂直穿墙检测（瞬间垂直穿透方块/排除合法传送方式）
        # === V4.0 玩家行为安全模块 ===
        anti-nuker: true                  # 快速破坏检测（挖矿速度/范围/模式识别）
        anti-auto-clicker: true           # 自动点击检测（CPS统计/点击间隔熵值分析）
        anti-chest-steal: true            # 自动偷箱检测（开箱/取物速度模式识别）
        anti-auto-fish: true              # 自动钓鱼检测（钓鱼行为时序/反应速度）
        anti-inventory-manipulation: true # 背包操作检测（非正常速度/非法槽位操作）
        anti-baritone: true               # AI寻路机器人检测（路径平滑度/行为重复率）
        # === V4.0 服务器保护模块 ===
        packet-flood-protection: true     # 数据包洪水防护（窗口/自定义负载/品牌包限制）
        anti-sign-exploit: true           # 告示牌漏洞防护（超长JSON/无效组件/NBT炸弹）
        anti-book-ban: true               # 书与笔封禁防护（超大页码/超深JSON层级）
        anti-resource-pack-exploit: true  # 资源包漏洞防护（恶意URL/超大文件/格式校验）
        anti-tab-complete-crash: true     # Tab补全崩溃防护（长文本/深度嵌套补全限制）
        anti-offline-mode-spoof: true     # 离线UUID欺诈防护（正版UUID冲突/IP关联验证）
        # === V4.0 访问控制模块 ===
        op-privilege-monitor: true        # OP权限监控（权限变更/敏感命令执行审计）
        config-tamper-detection: true     # 配置文件篡改检测（Hash基线/实时监控ops/whitelist）
        backdoor-plugin-scanner: true     # 后门插件扫描（已知恶意类名/远程执行/隐藏命令）
        anti-vpn-proxy: true              # VPN代理检测（已知VPN IP库/托管ASN匹配）
        anti-alt-account: true            # 小号检测（IP关联/行为相似度/登录时间模式）
        anti-name-spoof: true             # 名称冒充检测（管理员/知名玩家昵称伪造）
        # === V4.0 聊天社交安全模块 ===
        chat-flood-protection: true       # 聊天洪水防护（消息频率/相似度/长度激增）
        anti-advertisement: true          # 广告检测（IP地址/域名/群号正则匹配）
        anti-phishing-link: true          # 钓鱼链接检测（可疑域名/短链接/SSL证书校验）
        anti-command-abuse: true          # 命令滥用检测（频率限制/敏感命令拦截/权限校验）
        player-privacy: true              # 玩家隐私保护（IP脱敏/坐标隐藏/日志匿名化）
        # === V5.0 服务器保护扩展模块 ===
        chunk-load-rate-limiter: true     # 区块加载速率限制（WARN/LIMIT/BLOCK三级响应/ChunkBan检测）
        entity-count-enforcer: true       # 实体数量强制执行（按区块/玩家/类型优先级自动移除）
        redstone-update-limiter: true     # 红石更新频率限制（逐tick检测/降频/冻结/指数退避）
        crash-exploit-signature-db: true  # 崩溃漏洞签名数据库（12种已知签名/PacketSize/NBT/Item四级响应）
        # === V4.0 网络协议安全模块 ===
        protocol-validator: true         # 协议状态机验证（HANDSHAKE→STATUS→LOGIN→PLAY状态转换检测）
        token-bucket-rate-limiter: true   # 令牌桶速率限制（可复用限速原语/可配置速率与突发容量）
        bot-fingerprint: true            # 机器人行为指纹检测（登录时序/命名模式/移动熵值/聊天/延迟）
        nbt-exploit-prevention: true     # NBT漏洞防护（深度检测/尺寸限制/BookBan/SignExploit/ChunkBan）
        handshake-validator: true        # 连接握手验证（协议版本/nextState/主机名/Ping洪水/端口扫描）
        # === V5.3 反作弊世界/玩家/杂物模块（Meteor Client 对抗） ===
        anti-speed-mine: true             # 加速挖掘检测（SpeedMine/InstaMine/PacketMine hack）
        anti-fast-use: true               # 加速物品使用检测（FastUse hack）
        anti-no-interact: true            # 交互绕过检测（NoInteract hack）
        anti-auto-mine: true              # 自动挖矿检测（AutoMine hack）
        anti-vein-miner: true             # 矿脉自动挖掘检测（VeinMiner hack）
        anti-auto-tool: true              # 自动工具切换检测（AutoTool hack）
        anti-fake-player: true            # 假人实体检测（FakePlayer hack）
        anti-piston-aura: true            # 活塞陷阱自动化检测（PistonAura hack）
        anti-anchor: true                 # 洞穴锚点检测（Anchor hack）
        anti-stash-finder: true           # 自动储藏箱探测（StashFinder hack）

  dashboard:
    enabled: true
    title: Aluer Nebula Console
    subtitle: PaperMC defense, recovery, and remote operations fabric
    refresh-interval-seconds: 6
    compact-terminal: true
    ssh-gateway:
      enabled: true
      session-timeout-minutes: 30
      max-sessions: 6
      command-timeout-seconds: 25
      strict-host-key-checking: false
      allow-private-key-paste: true
      require-engine-handshake: true
      handshake-ttl-seconds: 30

  webhook:
    enabled: false
    discord-url: ${ALUER_WEBHOOK_DISCORD:}
    slack-url: ${ALUER_WEBHOOK_SLACK:}

  report:
    dir: ./reports

server:
  port: 8080

spring:
  shell:
    interactive:
      enabled: true
    command:
      init:
        delay: 0

logging:
  level:
    root: INFO
    com.aluer: INFO
  file:
    name: /var/log/serverguard.log
